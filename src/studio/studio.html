<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Étal — studio d'annonces Vinted</title>
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" data-view="listings">
        <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="#f6f1e7" stroke="#1b1712" stroke-width="1.8" />
          <path d="M7.5 16 L13.5 9.5 H25.5 V22.5 H13.5 Z" fill="#d1502a" stroke="#1b1712" stroke-width="1.8" stroke-linejoin="round" />
          <circle cx="16" cy="16" r="1.7" fill="#f6f1e7" stroke="#1b1712" stroke-width="1.3" />
        </svg>
        <span class="brand-text">
          <strong>Étal</strong>
          <em>studio d'annonces Vinted</em>
        </span>
      </button>

      <div class="topbar-actions">
        <button class="conn" id="connection" type="button" title="Ouvrir Vinted et vérifier la connexion">
          <i></i><span>Vérification…</span>
        </button>
        <button class="btn ghost" id="btn-import" type="button">Importer</button>
        <button class="btn ghost" id="btn-settings" type="button">Réglages</button>
        <button class="btn primary" id="btn-new" type="button">Nouvelle annonce</button>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" aria-label="Navigation">
        <button class="rail-item" data-view="listings" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="5.5" height="5.5" rx="1" /><rect x="10.5" y="2" width="5.5" height="5.5" rx="1" /><rect x="2" y="10.5" width="5.5" height="5.5" rx="1" /><rect x="10.5" y="10.5" width="5.5" height="5.5" rx="1" /></svg>
          <span>Annonces</span>
        </button>
        <button class="rail-item" data-view="dashboard" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="10" width="3" height="6" rx="0.8" /><rect x="7.5" y="6" width="3" height="10" rx="0.8" /><rect x="12.5" y="2.5" width="3" height="13.5" rx="0.8" /></svg>
          <span>Tableau de bord</span>
        </button>
        <button class="rail-item" data-view="templates" type="button">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2.5h7l3 3v10H4z" /><path d="M6.5 8h5M6.5 11h5M6.5 5h2" /></svg>
          <span>Modèles</span>
        </button>

        <div class="rail-foot">
          <p class="rail-label">Quota du jour</p>
          <div class="quota-bar"><span id="quota-fill"></span></div>
          <p class="rail-quota" id="quota-text">—</p>
          <p class="rail-note">Tout reste sur cet ordinateur.</p>
        </div>
      </nav>

      <main class="main" id="main"></main>
    </div>

    <section class="queue" id="queue" hidden>
      <div class="queue-head">
        <strong id="queue-title">Publication</strong>
        <button class="link" id="queue-stop" type="button">Arrêter</button>
      </div>
      <div class="queue-progress"><div class="bar" id="queue-bar"></div></div>
      <p id="queue-status">En attente…</p>
      <ul class="queue-log" id="queue-log"></ul>
    </section>

    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden>
      <header class="drawer-head">
        <div>
          <p class="eyebrow">Préférences</p>
          <h2>Réglages</h2>
        </div>
        <button class="icon-btn" id="drawer-close" type="button" aria-label="Fermer">×</button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <input type="file" id="photo-input" accept="image/*" multiple hidden />
    <input type="file" id="csv-input" accept=".csv,text/csv" hidden />
    <div class="toasts" id="toasts"></div>

    <script type="module" src="studio.js"></script>
  </body>
</html>
